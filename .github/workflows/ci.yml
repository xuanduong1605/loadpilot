name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend build, PostgreSQL baseline and authentication smoke test
        working-directory: apps/platform
        run: mvn -B -ntp verify
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck and static export
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run build
          test -f out/index.html
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/dev.yml config --quiet
          docker compose --env-file .env -f infra/compose/vps.yml config --quiet
      - name: Container smoke test
        shell: bash
        run: |
          docker compose --env-file .env -f infra/compose/dev.yml up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8088/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --max-time 5 http://127.0.0.1:8088/healthz
          curl --fail --silent --max-time 5 http://127.0.0.1:8088/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:8088/api/status)" = 401
          curl --fail --silent --max-time 5 --user 'admin:replace-with-a-long-random-login-password' http://127.0.0.1:8088/api/status | jq -e '.stage == "project-setup"'
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose/dev.yml logs --no-color --tail 100
      - name: Clean up smoke stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f infra/compose/dev.yml down --volumes --remove-orphans
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Set registry name
        id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: platform
        with:
          context: apps/platform
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.names.outputs.prefix }}-platform:sha-${{ github.sha }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,scope=platform,mode=max
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: apps/web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.names.outputs.prefix }}-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Prepare immutable deployment bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          mkdir -p bundle/infra/compose bundle/scripts
          cp infra/compose/vps.yml bundle/infra/compose/
          cp scripts/deploy-vps.sh bundle/scripts/
          printf 'PLATFORM_IMAGE=%s-platform@%s\nWEB_IMAGE=%s-web@%s\n' "$PREFIX" "$PLATFORM_DIGEST" "$PREFIX" "$WEB_DIGEST" > bundle/release.env
          printf '%s\n' "$GITHUB_SHA" > bundle/COMMIT
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: vps-release
          path: bundle/
          retention-days: 30
