name: Build and deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loadpilot-production
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Build and verify FE + BE
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/loadpilot_ci
      TEST_DATABASE_USER: loadpilot_ci
      TEST_DATABASE_PASSWORD: ci-disposable-database-password
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/loadpilot_ci
      POSTGRES_USER: loadpilot_ci
      POSTGRES_PASSWORD: ci-disposable-database-password
      PLATFORM_USER: admin
      PLATFORM_PASSWORD: ci-disposable-platform-password
      SERVER_ADDRESS: 127.0.0.1
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/platform/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Prepare CI database
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16 shellcheck
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE loadpilot_ci LOGIN PASSWORD 'ci-disposable-database-password';
          CREATE DATABASE loadpilot_ci OWNER loadpilot_ci;
          SQL
      - name: Build and test both apps
        run: |
          bash -n scripts/deploy-vps.sh
          shellcheck scripts/deploy-vps.sh
          mvn -f apps/platform/pom.xml -B -ntp verify
          npm --prefix apps/web ci --no-audit --no-fund
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
      - name: Package matching JAR and static files
        run: |
          mkdir bundle
          cp apps/platform/target/platform-0.1.0-SNAPSHOT.jar bundle/platform.jar
          cp scripts/deploy-vps.sh bundle/deploy-vps.sh
          for route in '' login targets scenarios experiments comparisons settings; do
            test -s "apps/web/out/$route/index.html"
          done
          test -s apps/web/out/404.html
          test -z "$(find apps/web/out -mindepth 1 ! -type f ! -type d -print -quit)"
          mkdir -p apps/web/out/.well-known
          printf '%s\n' "$GITHUB_SHA" > apps/web/out/.well-known/loadpilot-release
          tar -czf bundle/web.tar.gz -C apps/web/out .
          printf '%s\n' "$GITHUB_SHA" > bundle/COMMIT
          (cd bundle && sha256sum platform.jar web.tar.gz COMMIT deploy-vps.sh > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: apps/platform/target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: success() && github.ref == 'refs/heads/main'
        with:
          name: vps-release-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30
  deploy:
    name: Deploy verified release to VPS
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_PUBLIC_URL: ${{ vars.VPS_PUBLIC_URL }}
    steps:
      - name: Download tested release
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release
      - name: Check VPS configuration
        run: |
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$VPS_USER" != root && "$VPS_USER" != postgres && "$VPS_USER" != loadpilot ]]
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$VPS_SSH_PORT >= 1 && 10#$VPS_SSH_PORT <= 65535))
          [[ "$VPS_PUBLIC_URL" =~ ^(http|https)://[A-Za-z0-9][A-Za-z0-9.-]*(:([0-9]{1,5}))?$ ]]
          public_port=${BASH_REMATCH[3]}
          if [[ -n "$public_port" ]]; then ((10#$public_port >= 1 && 10#$public_port <= 65535)); fi
          [[ ! "$VPS_HOST $VPS_USER $VPS_PUBLIC_URL" =~ REPLACE|example\.(com|org|net) ]]
      - name: Verify tested release
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(cat release/COMMIT)" = "$EXPECTED_COMMIT"
          (cd release && sha256sum --strict --check SHA256SUMS)
          test -f release/platform.jar && test -f release/deploy-vps.sh
          tar -tzf release/web.tar.gz | awk '/^\// || /(^|\/)\.\.(\/|$)/ || /\\/ || /^[A-Za-z]:/ {bad=1} END {exit bad}'
          tar -tvzf release/web.tar.gz | awk 'substr($0,1,1) !~ /[d-]/ {bad=1} END {exit bad}'
      - name: Install SSH identity
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
      - name: Transfer and activate verified release
        run: |
          release_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tar -C release -czf release.tgz .
          scp -P "$VPS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 release.tgz "$VPS_USER@$VPS_HOST:/opt/loadpilot/incoming/$release_id.tgz"
          ssh -p "$VPS_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "umask 022; mkdir /opt/loadpilot/releases/$release_id && tar -xzf /opt/loadpilot/incoming/$release_id.tgz -C /opt/loadpilot/releases/$release_id --no-same-owner && env LOADPILOT_ALLOW_APP_ROLLBACK=true LOADPILOT_PUBLIC_URL='$VPS_PUBLIC_URL' bash /opt/loadpilot/releases/$release_id/deploy-vps.sh /opt/loadpilot/releases/$release_id"
      - name: Verify public frontend and API routes
        run: |
          expected=$(cat release/COMMIT)
          actual=$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 10 "$VPS_PUBLIC_URL/.well-known/loadpilot-release")
          test "$actual" = "$expected"
          curl --fail --silent --show-error --max-time 10 "$VPS_PUBLIC_URL/healthz" | jq -e '.status == "UP"'
          for route in / /login/ /targets/ /scenarios/ /experiments/ /comparisons/ /settings/; do
            curl --fail --silent --show-error --max-time 10 "$VPS_PUBLIC_URL$route" >/dev/null
          done
          test "$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$VPS_PUBLIC_URL/api/status")" = 401
          {
            echo '### Deployment verified'
            echo "Commit: $expected"
            echo "Workflow run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo 'Private runtime configuration and host service files were not overwritten.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
