spring:
  application:
    name: loadpilot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loadpilot}
    username: ${POSTGRES_USER:loadpilot}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
server:
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: LOADPILOT_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
  tomcat:
    threads:
      max: 24
    max-http-form-post-size: 64KB
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
platform:
  execution:
    monitor-enabled: ${EXECUTION_MONITOR_ENABLED:false}
    cluster-grants-json: ${EXECUTION_CLUSTER_GRANTS_JSON:}
    destinations-json: ${EXECUTION_DESTINATIONS_JSON:}
    runtime-policy-json: ${EXECUTION_RUNTIME_POLICY_JSON:}
    runtime-evidence-directory: ${EXECUTION_RUNTIME_EVIDENCE_DIRECTORY:}
    runtime-evidence-keys-json: ${EXECUTION_RUNTIME_EVIDENCE_KEYS_JSON:}
    runtime-evidence-max-validity-seconds: ${EXECUTION_RUNTIME_EVIDENCE_MAX_VALIDITY_SECONDS:900}
    runtime-cni-namespace: ${EXECUTION_RUNTIME_CNI_NAMESPACE:}
    runtime-cni-daemonset: ${EXECUTION_RUNTIME_CNI_DAEMONSET:}
    runtime-probe-archive-directory: ${EXECUTION_RUNTIME_PROBE_ARCHIVE_DIRECTORY:}
  scenarios:
    node-executable: ${SCENARIO_NODE_EXECUTABLE:}
    validator-script: ${SCENARIO_VALIDATOR_SCRIPT:}
  username: ${PLATFORM_USER:admin}
  password: ${PLATFORM_PASSWORD:}
  connections:
    master-key: ${CONNECTION_MASTER_KEY:}
    allowed-origins: ${CONNECTION_ALLOWED_ORIGINS:}
    allowed-addresses: ${CONNECTION_ALLOWED_ADDRESSES:}
