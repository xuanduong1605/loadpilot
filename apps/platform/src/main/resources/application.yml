spring:
  application:
    name: loadpilot
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loadpilot}
    username: ${POSTGRES_USER:loadpilot}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
server:
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: LOADPILOT_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
  tomcat:
    threads:
      max: 24
    max-http-form-post-size: 64KB
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
platform:
  username: ${PLATFORM_USER:admin}
  password: ${PLATFORM_PASSWORD}
  connections:
    master-key: ${CONNECTION_MASTER_KEY:}
    allowed-origins: ${CONNECTION_ALLOWED_ORIGINS:}
    allowed-addresses: ${CONNECTION_ALLOWED_ADDRESSES:}
