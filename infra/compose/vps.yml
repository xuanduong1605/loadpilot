name: loadpilot
x-logs: &logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loadpilot}
      POSTGRES_USER: ${POSTGRES_USER:-loadpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["platform-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logs
  platform:
    image: ${PLATFORM_IMAGE:?Set PLATFORM_IMAGE}
    restart: unless-stopped
    mem_limit: 640m
    env_file: ../../.env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-loadpilot}
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logs
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    restart: unless-stopped
    mem_limit: 64m
    ports: ["127.0.0.1:8088:80"]
    depends_on: [platform]
    logging: *logs
volumes:
  platform-db:
